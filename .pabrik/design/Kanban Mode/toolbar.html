<div style="height:100%;background:#181616;border-bottom:1px solid #282727;display:flex;align-items:center;padding:0 24px;gap:16px;box-sizing:border-box;">

  <!-- Left: breadcrumbs + board name -->
  <div style="display:flex;align-items:center;gap:10px;min-width:0;">
    <div style="display:flex;align-items:center;gap:6px;color:#7a8382;font-size:13px;">
      <span style="cursor:pointer;">Workspaces</span>
      <span>/</span>
      <span style="cursor:pointer;">Pabrik Dev</span>
      <span>/</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#87a987,#8ea4a2);display:flex;align-items:center;justify-content:center;color:#223249;font-weight:700;font-size:12px;">S</div>
      <input value="Sprint Bulan Juni" style="background:transparent;border:none;outline:none;color:#c5c9c5;font-size:15px;font-weight:600;font-family:inherit;width:170px;" />
      <button style="width:24px;height:24px;border:none;background:transparent;border-radius:6px;cursor:pointer;color:#7a8382;display:flex;align-items:center;justify-content:center;">✎</button>
    </div>
  </div>

  <!-- Filter chips -->
  <div style="display:flex;align-items:center;gap:6px;margin-left:8px;">
    <button style="display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid #393836;background:#1D1C19;border-radius:6px;cursor:pointer;color:#a6a69c;font-size:12px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      Filter
      <span style="background:#8992a7;color:#223249;border-radius:8px;padding:0 5px;font-size:10px;font-weight:600;margin-left:2px;">3</span>
    </button>
    <button style="display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid #393836;background:#1D1C19;border-radius:6px;cursor:pointer;color:#a6a69c;font-size:12px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="9" y2="18"/></svg>
      Sort
    </button>
    <button style="display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid #393836;background:#1D1C19;border-radius:6px;cursor:pointer;color:#a6a69c;font-size:12px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      Search
    </button>
  </div>

  <!-- Right: view toggle + share -->
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
    <!-- View switcher -->
    <div style="display:flex;background:#1D1C19;border:1px solid #393836;border-radius:8px;padding:2px;">
      <button style="padding:4px 10px;background:#282727;border:none;border-radius:6px;cursor:pointer;color:#c5c9c5;font-size:12px;display:flex;align-items:center;gap:5px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Board
      </button>
      <button style="padding:4px 10px;background:transparent;border:none;border-radius:6px;cursor:pointer;color:#7a8382;font-size:12px;display:flex;align-items:center;gap:5px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        List
      </button>
      <button style="padding:4px 10px;background:transparent;border:none;border-radius:6px;cursor:pointer;color:#7a8382;font-size:12px;display:flex;align-items:center;gap:5px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendar
      </button>
    </div>

    <!-- Avatar group -->
    <div style="display:flex;align-items:center;margin-right:4px;">
      <div style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#c4b28a,#b6927b);display:flex;align-items:center;justify-content:center;color:#223249;font-weight:600;font-size:11px;border:2px solid #181616;">G</div>
      <div style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#8ea4a2,#a292a3);display:flex;align-items:center;justify-content:center;color:#223249;font-weight:600;font-size:11px;border:2px solid #181616;margin-left:-8px;">M</div>
      <div style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#8992a7,#a292a3);display:flex;align-items:center;justify-content:center;color:#223249;font-weight:600;font-size:11px;border:2px solid #181616;margin-left:-8px;">A</div>
      <div style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#87a987,#c4b28a);display:flex;align-items:center;justify-content:center;color:#223249;font-weight:600;font-size:11px;border:2px solid #181616;margin-left:-8px;">R</div>
      <div style="width:26px;height:26px;border-radius:50%;background:#282727;color:#7a8382;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:10px;border:2px solid #181616;margin-left:-8px;">+2</div>
    </div>

    <button style="padding:6px 12px;border:1px solid #393836;background:#1D1C19;border-radius:8px;cursor:pointer;color:#a6a69c;font-size:12px;display:flex;align-items:center;gap:6px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Share
    </button>

    <button style="padding:6px 14px;border:none;background:linear-gradient(135deg,#8992a7,#9CABCA);border-radius:8px;cursor:pointer;color:#223249;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(137,146,167,0.25);">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New task
    </button>
  </div>
</div>
