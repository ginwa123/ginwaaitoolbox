[pytest]
# Three test suites live under tests/:
#
#   tests/functional/          — API-only functional tests (Python + urllib).
#                                Boots a pabrik binary against an isolated
#                                tmpdir HOME; exercises the HTTP wire.
#                                See tests/functional/README.md.
#
#   tests/functional_ui/       — UI-driven functional tests (Playwright).
#                                Boots pabrik + a Vite dev server; drives
#                                the running web app in headless Chromium.
#                                See tests/functional_ui/README.md.
#
#   tests/functional_android/  — UI-driven functional tests for the native
#                                Android client. Boots pabrik (no Vite, no
#                                browser) and drives a real emulator through
#                                Gradle. See tests/functional_android/README.md
#                                and docs/superpowers/plans/2026-09-27-android-functional-ui-test.md.
#
# All three need ``tests/functional`` on sys.path because they reuse
# ``FunctionalHarness`` from ``tests/functional/harness.py``. The android suite
# additionally needs ``tests/functional_ui`` for ``db_seed.DbSeed`` — the same
# seeder the web suite uses, so a real payload shape is written in exactly one
# place. Adding only a child suite's own directory would shadow the parent
# ``harness`` module with a stub — that's why the paths are shared.
#
# ``tests`` itself is on the path because ``platform_gates`` lives there: it
# is the single platform-gate table all three suites read (see the module
# docstring for why a skip needs a platform reason rather than "it failed").
# Listing it explicitly rather than leaning on pytest's rootdir sys.path
# insertion means the import resolves the same way under ``pytest
# tests/functional/``, ``pytest tests/functional_ui/`` and a bare ``pytest``.
#
# The web suites (functional + functional_ui) are the default `testpaths`
# and are meant to be run TOGETHER: one interpreter, one Playwright
# browser, one pabrik binary build, one report. Running them separately
# doubles every setup cost for no extra coverage. The Android suite stays
# OUT of testpaths because it is a different job in CI (it needs a real
# emulator via `reactivecircus/android-emulator-runner`, and its build is
# Gradle + AVD, not zig + Vite) and running it locally without one would
# only produce skips. Invoke it explicitly:
#
#   pytest                          # web suites, both at once (default)
#   pytest tests/functional/        # API-only
#   pytest tests/functional_ui/     # UI-driven, web
#   pytest tests/functional_android/  # UI-driven, Android device/emulator
pythonpath = tests tests/functional tests/functional_ui tests/functional_android

testpaths = tests/functional tests/functional_ui
addopts = --tb=short -v --durations=10
