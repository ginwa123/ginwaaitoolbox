[pytest]
# Two test suites live under tests/:
#
#   tests/functional/      — API-only functional tests (Python + urllib).
#                            Boots a nalar binary against an isolated
#                            tmpdir HOME; exercises the HTTP wire.
#                            See tests/functional/README.md.
#
#   tests/functional_ui/   — UI-driven functional tests (Playwright).
#                            Boots nalar + a Vite dev server; drives
#                            the running web app in headless Chromium.
#                            See tests/functional_ui/README.md.
#
# Both suites need ``tests/functional`` on sys.path because the UI
# suite reuses ``FunctionalHarness`` from ``tests/functional/harness.py``
# (composition: ``UIHarness`` holds a ``FunctionalHarness``). Adding
# only ``tests/functional_ui`` would shadow the parent ``harness`` with
# a stub — that's why the path is shared.
#
# Run a single suite explicitly (testpaths is intentionally narrow
# so ``pytest`` alone doesn't accidentally run both suites with
# different fixture setups):
#
#   pytest tests/functional/      # API-only
#   pytest tests/functional_ui/   # UI-driven
#
pythonpath = tests/functional tests/functional_ui

# Default testpaths is the API-only suite — it's the lighter of the
# two (no Playwright/Vite needed). To run the UI suite, invoke
# ``pytest tests/functional_ui/`` explicitly.
testpaths = tests/functional
addopts = --tb=short -v --durations=10
