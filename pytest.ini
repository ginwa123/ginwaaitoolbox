[pytest]
# Three test suites live under tests/:
#
#   tests/functional/          — API-only functional tests (Python + urllib).
#                                Boots a nalar binary against an isolated
#                                tmpdir HOME; exercises the HTTP wire.
#                                See tests/functional/README.md.
#
#   tests/functional_ui/       — UI-driven functional tests (Playwright).
#                                Boots nalar + a Vite dev server; drives
#                                the running web app in headless Chromium.
#                                See tests/functional_ui/README.md.
#
#   tests/functional_android/  — UI-driven functional tests for the native
#                                Android client. Boots nalar (no Vite, no
#                                browser) and drives a real emulator through
#                                Gradle. See tests/functional_android/README.md
#                                and docs/superpowers/plans/2026-09-27-android-functional-ui-test.md.
#
# All three need ``tests/functional`` on sys.path because they reuse
# ``FunctionalHarness`` from ``tests/functional/harness.py``. The android suite
# additionally needs ``tests/functional_ui`` for ``db_seed.DbSeed`` — the same
# seeder the web suite uses, so a real payload shape is written in exactly one
# place. Adding only a child suite's own directory would shadow the parent
# ``harness`` module with a stub — that's why the paths are shared.
#
# Run a single suite explicitly (testpaths is intentionally narrow so
# ``pytest`` alone doesn't accidentally run all three with different fixture
# setups):
#
#   pytest tests/functional/          # API-only
#   pytest tests/functional_ui/       # UI-driven, web
#   pytest tests/functional_android/  # UI-driven, Android device/emulator
#
pythonpath = tests/functional tests/functional_ui tests/functional_android

# Default testpaths is the API-only suite — it's the lightest of the three
# (no Playwright, no Vite, no emulator). To run either UI suite, invoke it
# explicitly as above.
testpaths = tests/functional
addopts = --tb=short -v --durations=10
