[pytest]
# Add tests/functional to sys.path so sibling modules (harness, conftest)
# are importable without prefix. Functional tests live alongside the
# module under test, not in a sub-package.
pythonpath = tests/functional

# Auto-discover exactly one test session per invocation. We don't use
# xdist here by default; suites are independent and pytest can be
# invoked with -n auto in CI if parallelism is desired.
testpaths = tests/functional
addopts = --tb=short -v --durations=10
