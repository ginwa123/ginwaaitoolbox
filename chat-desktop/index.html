<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Atelier Chat</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Fraunces + DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            charcoal: '#1a1a1a',
            cream: '#f5f0e8',
            terracotta: '#c45d3a',
            'terracotta-dark': '#a84d2f',
            'warm-gray': '#2d2d2d',
            'light-gray': '#e8e4dc',
          },
          fontFamily: {
            display: ['Fraunces', 'serif'],
            body: ['DM Sans', 'sans-serif'],
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.4s ease-out forwards',
            'pulse-dot': 'pulseDot 1.4s ease-in-out infinite',
            'slide-in': 'slideIn 0.3s ease-out forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            pulseDot: {
              '0%, 80%, 100%': { transform: 'scale(0.6)', opacity: '0.4' },
              '40%': { transform: 'scale(1)', opacity: '1' },
            },
            slideIn: {
              '0%': { opacity: '0', transform: 'translateX(20px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' },
            },
          },
        },
      },
    }
  </script>
  
  <style>
    /* Paper texture overlay */
    .paper-texture {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      background-blend-mode: overlay;
    }
    
    /* Custom scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #e8e4dc;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #c45d3a;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #a84d2f;
    }
    
    /* Stagger animation delays */
    .stagger-1 { animation-delay: 0ms; }
    .stagger-2 { animation-delay: 80ms; }
    .stagger-3 { animation-delay: 160ms; }
    .stagger-4 { animation-delay: 240ms; }
    .stagger-5 { animation-delay: 320ms; }
  </style>
</head>

<body class="bg-charcoal min-h-screen flex items-center justify-center p-4 font-body paper-texture">
  
  <!-- Chat Container -->
  <div class="w-full max-w-2xl h-[700px] bg-cream rounded-2xl shadow-2xl shadow-charcoal/30 overflow-hidden flex flex-col border border-light-gray/50">
    
    <!-- Header -->
    <header class="bg-charcoal px-6 py-4 flex items-center justify-between border-b-2 border-terracotta">
      <div class="flex items-center gap-3">
        <!-- Avatar -->
        <div class="w-10 h-10 rounded-full bg-terracotta flex items-center justify-center">
          <svg class="w-5 h-5 text-cream" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
        </div>
        <div>
          <h1 class="font-display text-xl font-semibold text-cream tracking-tight">Digital Atelier</h1>
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
            <span class="text-xs text-cream/60">Online</span>
          </div>
        </div>
      </div>
      
      <!-- Menu Button -->
      <button class="w-9 h-9 rounded-lg bg-cream/10 hover:bg-cream/20 transition-colors flex items-center justify-center group">
        <svg class="w-5 h-5 text-cream/70 group-hover:text-cream transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/>
        </svg>
      </button>
    </header>
    
    <!-- Messages Area -->
    <div id="messagesContainer" class="flex-1 overflow-y-auto px-6 py-4 custom-scrollbar bg-cream/50">
      <div id="messagesList" class="flex flex-col gap-4">
        <!-- Messages will be injected here -->
      </div>
      
      <!-- Typing Indicator (hidden by default) -->
      <div id="typingIndicator" class="hidden flex items-center gap-2 mt-4 animate-fade-in-up">
        <div class="w-8 h-8 rounded-full bg-warm-gray flex items-center justify-center">
          <svg class="w-4 h-4 text-cream" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <div class="bg-warm-gray rounded-2xl rounded-tl-sm px-4 py-3 flex items-center gap-1">
          <span class="w-2 h-2 bg-cream/60 rounded-full animate-pulse-dot stagger-1"></span>
          <span class="w-2 h-2 bg-cream/60 rounded-full animate-pulse-dot stagger-2"></span>
          <span class="w-2 h-2 bg-cream/60 rounded-full animate-pulse-dot stagger-3"></span>
        </div>
      </div>
    </div>
    
    <!-- Input Area -->
    <div class="bg-charcoal px-6 py-4 border-t border-cream/10">
      <form id="chatForm" class="flex items-end gap-3">
        <div class="flex-1 relative">
          <textarea 
            id="messageInput"
            class="w-full bg-warm-gray border border-cream/20 rounded-xl px-4 py-3 pr-12 text-cream placeholder-cream/40 resize-none font-body focus:outline-none focus:border-terracotta focus:ring-2 focus:ring-terracotta/20 transition-all"
            placeholder="Share your thoughts..."
            rows="1"
          ></textarea>
          
          <!-- Character count -->
          <span id="charCount" class="absolute bottom-2 right-3 text-xs text-cream/30 font-body">0</span>
        </div>
        
        <button 
          type="submit"
          id="sendButton"
          class="w-12 h-12 bg-terracotta hover:bg-terracotta-dark rounded-xl flex items-center justify-center transition-all hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 group"
        >
          <svg class="w-5 h-5 text-cream transform group-hover:-translate-y-0.5 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </form>
      
      <!-- Keyboard hint -->
      <p class="text-center text-cream/30 text-xs mt-2 font-body">
        Press <kbd class="px-1.5 py-0.5 bg-cream/10 rounded text-cream/50">Enter</kbd> to send · <kbd class="px-1.5 py-0.5 bg-cream/10 rounded text-cream/50">Ctrl + Enter</kbd> for new line
      </p>
    </div>
  </div>

  <script>
    // ==========================================
    // Chat Application Logic
    // ==========================================
    
    class ChatApp {
      constructor() {
        this.messages = this.loadMessages();
        this.isTyping = false;
        this.maxChars = 500;
        
        // DOM Elements
        this.messagesList = document.getElementById('messagesList');
        this.typingIndicator = document.getElementById('typingIndicator');
        this.messageInput = document.getElementById('messageInput');
        this.chatForm = document.getElementById('chatForm');
        this.sendButton = document.getElementById('sendButton');
        this.charCount = document.getElementById('charCount');
        
        this.init();
      }
      
      init() {
        // Event listeners
        this.chatForm.addEventListener('submit', (e) => this.handleSubmit(e));
        this.messageInput.addEventListener('input', () => this.autoResize());
        this.messageInput.addEventListener('input', () => this.updateCharCount());
        
        // Initial render
        this.renderMessages();
        
        // Auto-resize on load
        this.autoResize();
      }
      
      // ==========================================
      // Message Management
      // ==========================================
      
      loadMessages() {
        const stored = localStorage.getItem('chat_messages');
        return stored ? JSON.parse(stored) : this.getInitialMessages();
      }
      
      saveMessages() {
        localStorage.setItem('chat_messages', JSON.stringify(this.messages));
      }
      
      getInitialMessages() {
        return [
          {
            id: 1,
            type: 'bot',
            content: 'Welcome to the Digital Atelier. I\'m here to help you explore creative ideas and bring your vision to life. What would you like to discuss today?',
            timestamp: Date.now() - 3600000,
          },
          {
            id: 2,
            type: 'user',
            content: 'I\'d love to explore some design concepts for a creative project I\'m working on.',
            timestamp: Date.now() - 3500000,
          },
          {
            id: 3,
            type: 'bot',
            content: 'That sounds exciting! I\'d be happy to brainstorm with you. Are you thinking about visual design, product design, or perhaps something more conceptual?',
            timestamp: Date.now() - 3400000,
          },
        ];
      }
      
      addMessage(type, content) {
        const message = {
          id: Date.now(),
          type,
          content,
          timestamp: Date.now(),
        };
        
        this.messages.push(message);
        this.saveMessages();
        this.renderMessage(message, true);
        this.scrollToBottom();
        
        if (type === 'user') {
          this.simulateBotResponse(content);
        }
      }
      
      renderMessages() {
        this.messagesList.innerHTML = '';
        this.messages.forEach((msg, index) => {
          this.renderMessage(msg, false, index * 80);
        });
        this.scrollToBottom();
      }
      
      renderMessage(message, animate = true, delay = 0) {
        const isUser = message.type === 'user';
        const time = this.formatTime(message.timestamp);
        
        const messageEl = document.createElement('div');
        messageEl.className = `
          ${animate ? 'animate-fade-in-up opacity-0' : ''} 
          flex ${isUser ? 'justify-end' : 'justify-start'}
        `;
        messageEl.style.animationDelay = `${delay}ms`;
        
        messageEl.innerHTML = `
          <div class="flex ${isUser ? 'flex-row-reverse' : 'flex-row'} items-end gap-2 max-w-[80%]">
            <!-- Avatar -->
            <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center ${
              isUser 
                ? 'bg-terracotta order-2' 
                : 'bg-warm-gray order-1'
            }">
              ${isUser 
                ? `<svg class="w-4 h-4 text-cream" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                   </svg>`
                : `<svg class="w-4 h-4 text-cream" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                   </svg>`
              }
            </div>
            
            <!-- Message Bubble -->
            <div class="group relative">
              <div class="px-4 py-3 rounded-2xl ${
                isUser 
                  ? 'bg-terracotta text-cream rounded-tr-sm' 
                  : 'bg-warm-gray text-cream rounded-tl-sm'
              } shadow-md">
                <p class="text-sm leading-relaxed font-body whitespace-pre-wrap break-words">${this.escapeHtml(message.content)}</p>
              </div>
              
              <!-- Timestamp & Status -->
              <div class="flex items-center gap-2 mt-1 ${
                isUser ? 'justify-end' : 'justify-start'
              }">
                <span class="text-[10px] text-charcoal/40 font-body">${time}</span>
                ${isUser ? `
                  <span class="text-[10px] text-terracotta/60">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                  </span>
                ` : ''}
              </div>
            </div>
          </div>
        `;
        
        this.messagesList.appendChild(messageEl);
      }
      
      // ==========================================
      // Bot Response Simulation
      // ==========================================
      
      async simulateBotResponse(userMessage) {
        this.showTyping();
        
        // Simulate thinking time based on message length
        const thinkTime = 800 + Math.random() * 1200;
        
        await new Promise(resolve => setTimeout(resolve, thinkTime));
        
        const responses = this.generateResponse(userMessage);
        
        this.hideTyping();
        
        for (const response of responses) {
          await new Promise(resolve => setTimeout(resolve, 300));
          this.addMessage('bot', response);
        }
      }
      
      generateResponse(userMessage) {
        const responses = [
          "That's a fascinating perspective! Let me think about how we can expand on that idea.",
          "I love where this is going. The creative possibilities are endless here.",
          "Interesting thought. Have you considered approaching this from a different angle?",
          "Great idea! Here's a thought that might complement your vision...",
          "Let's explore this further. What aspects are most important to you?",
        ];
        
        const randomResponses = responses
          .sort(() => Math.random() - 0.5)
          .slice(0, 1);
        
        return randomResponses;
      }
      
      showTyping() {
        this.isTyping = true;
        this.typingIndicator.classList.remove('hidden');
        this.scrollToBottom();
      }
      
      hideTyping() {
        this.isTyping = false;
        this.typingIndicator.classList.add('hidden');
      }
      
      // ==========================================
      // Form Handling
      // ==========================================
      
      handleSubmit(e) {
        e.preventDefault();
        
        const content = this.messageInput.value.trim();
        if (!content || this.isTyping) return;
        
        if (content.length > this.maxChars) {
          alert(`Message too long. Maximum ${this.maxChars} characters.`);
          return;
        }
        
        this.addMessage('user', content);
        this.messageInput.value = '';
        this.updateCharCount();
        this.autoResize();
      }
      
      // ==========================================
      // Utilities
      // ==========================================
      
      autoResize() {
        const textarea = this.messageInput;
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
      }
      
      updateCharCount() {
        const length = this.messageInput.value.length;
        this.charCount.textContent = length;
        
        if (length > this.maxChars * 0.9) {
          this.charCount.classList.add('text-terracotta');
          this.charCount.classList.remove('text-cream/30');
        } else {
          this.charCount.classList.remove('text-terracotta');
          this.charCount.classList.add('text-cream/30');
        }
        
        this.sendButton.disabled = length === 0 || length > this.maxChars;
      }
      
      scrollToBottom() {
        const container = document.getElementById('messagesContainer');
        container.scrollTop = container.scrollHeight;
      }
      
      formatTime(timestamp) {
        const date = new Date(timestamp);
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      
      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    }
    
    // Initialize the chat app
    document.addEventListener('DOMContentLoaded', () => {
      window.chatApp = new ChatApp();
    });
  </script>
</body>
</html>
