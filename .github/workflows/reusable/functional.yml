# Reusable functional-suite run: ONE platform, ONE shard.
#
# TWO AXES, TWO REASONS
# ---------------------
# 1. PER PLATFORM. This used to be a 3-cell `strategy.matrix` that
#    `needs: backend` — which means it waited for ALL THREE backend cells,
#    including the macOS and Windows ones whose artifacts it does not use
#    (each shard rebuilds from the same SHA via `zig build
#    functional-test-all`). Called once per platform from ci.yml instead,
#    each call gets its own real `needs:` edge against its own backend
#    cell, so the Linux shards start on Linux green rather than on "the
#    slowest platform in the pipeline" green.
#
# 2. PER SHARD. This job was the long pole: ~50 minutes of pytest, and
#    the only reason the whole pipeline is as long as it is. Split into
#    `shard_total` jobs, wall clock drops to roughly the longest shard.
#    The split itself lives in tests/conftest.py + tests/func_shard.py —
#    the env vars below are the whole contract, and the selector raises
#    rather than selecting nothing if it is handed a bad index.
#
# The alternative to sharding was folding build + backend tests +
# functional tests into one job per platform, which saves a checkout and
# a compile but cannot be split any further. Sharding wins because the
# per-test cost is boot-a-nalar, not compile: the expensive input is
# wall clock, and only separate jobs attack wall clock.
#
# NO `concurrency:` BLOCK — see the identical note in reusable/backend.yml.
#
# BOTH SUITES, ONE PYTEST INVOCATION
# ---------------------------------
# The API suite (tests/functional/) and the Playwright UI suite
# (tests/functional_ui/) run in ONE `zig build functional-test-all`, in
# ONE pytest process. They were separate jobs once; that charged every
# shared input twice per PR (a second venv, a second `playwright install
# chromium` at ~150 MB, a second full `zig build install` walk for the
# same binary) and produced two verdicts that could disagree. One process
# pays it once and answers one question. Sharding does not undo that: all
# shards run the same single invocation, each with a different slice of
# the collected items.
#
# THREE PLATFORMS, NOT ONE
# ------------------------
# The suites exercise a real binary over a real socket, and both have
# shipped Windows/macOS bugs the Linux cell structurally cannot see — a
# hardcoded "/tmp" that stops being an absolute path, a tmpdir allow-list
# that only matched POSIX prefixes, an rmtree that raced a still-running
# child. None of those are hypothetical: they are what the platform-gate
# table in tests/platform_gates.py and the `harness_path()` helper exist
# for, and both were written in the change that made this a matrix. A gate
# that is never exercised by CI is a comment, not a gate.
#
# Per-platform notes that are not obvious from the image name:
#   - macOS ARM64 (macos-15), matching the backend cell. The only true
#     macOS blocker in either suite is tui_perf_probe.py reading
#     /proc/<pid>/status for RSS; macOS has no /proc, and
#     tests/platform_gates.py skips that one module with that reason.
#   - Windows X64 (windows-2022), same image as the backend cell. Most of
#     the Windows skips are STRUCTURAL, not incidental — see the
#     terminal_* and tui_* rows in tests/platform_gates.py, where the
#     product itself has no pty backend (`terminal_session.zig`
#     `is_pty_os = linux || macos`) and Python has no `pty` module.
#   - Linux X64 (ubuntu-24.04), for glibc 2.39 against build.zig's pinned
#     2.38 target, exactly as in the backend cell.
name: functional-test (reusable)

on:
  workflow_call:
    inputs:
      os:
        description: GitHub-hosted runner label, matching the backend cell it follows.
        required: true
        type: string
      label:
        description: Human platform name, used in the log banner.
        required: true
        type: string
      target_zig:
        description: >-
          Host zig triple. Used ONLY to key the .zig-cache below, so a
          shard cannot restore another platform's object files.
        required: true
        type: string
      shard_index:
        description: >-
          ZERO-based shard number, forwarded verbatim as
          NALAR_FUNC_SHARD_INDEX. Zero-based because that is what the
          selector indexes with; the job name shows the same number so
          the two are never confused.
        required: true
        type: number
      shard_total:
        description: >-
          Total shards for this platform, forwarded as
          NALAR_FUNC_SHARD_TOTAL. Every shard of one platform must pass
          the SAME value — a mismatch between two shards of the same
          platform means the union is not the suite.
        required: true
        type: number

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    # The platform and the shard are both in the caller's job id
    # (`functional-linux-1`), so this name only has to say which shard
    # of how many it is.
    name: shard ${{ inputs.shard_index }}/${{ inputs.shard_total }}
    runs-on: ${{ inputs.os }}
    # A cold Windows cell has to build the vcpkg ports before anything can
    # link, then a ~90 MB zig build, then ~1/3 of the suites, each booting
    # a real nalar per test. That is well inside 75 minutes; the previous
    # 90 was sized for a FULL unsharded run and the default 360 would let
    # a wedged runner hold a machine for six hours.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        # Pinned rather than "whatever the image ships": the venv below is
        # cached, and a venv is only valid for the exact minor version that
        # created it. An unpinned image default would let a base-image bump
        # silently restore an unusable venv.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node.js 24
        # Both suites need Node: the UI suite's UIHarness spawns
        # `pnpm run dev` to start the Vite dev server during Playwright
        # tests, and it resolves pnpm via shutil.which('pnpm') /
        # shutil.which('pnpm.cmd'), so a literal `pnpm` on PATH is what we
        # need. Pinned to Node 24 to match the dev box.
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm 11
        # pnpm/action-setup is the canonical way to install pnpm on a
        # GitHub-hosted runner. Version pinned to 11.x to match the dev box
        # and the workspace's existing toolchain. workspace .npmrc lives
        # in the repo root, NOT in $HOME, so this action does not need any
        # config_file input.
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # ── Per-platform system dependencies ────────────────────────────
      # The nalar service binary links libcurl / openssl / libpq / sqlite3
      # on every platform, and the UI suite additionally needs a browser.
      # Each cell therefore needs roughly what the backend cell for
      # the same image needs — minus the desktop webview, because this job
      # only builds the SERVICE binary (`zig build functional-test-all`
      # depends on the default install step, not on `nalar-desktop`). That
      # is why there is no WebView2 NuGet staging here.

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        # A GitHub-hosted runner is a FRESH VM per job, so every job has
        # to install its own system packages. The list lives in
        # scripts/ci-install-linux-deps.sh precisely because it used to be
        # copy-pasted into three places — and when it drifted, it drifted
        # in all three at once. It also carries the headless-Chromium
        # shared-library set (libnss3, libgbm1, libasound2, ...) that the
        # Playwright launch needs, which is why the UI half of this job
        # inherits it for free.
        run: bash scripts/ci-install-linux-deps.sh

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # Mirrors the backend cell's macOS leg, minus the desktop-only
        # bits. No `brew update` (HOMEBREW_NO_AUTO_UPDATE=1): `brew
        # install` is already idempotent, and refreshing the entire
        # homebrew/core manifest costs ~30 MB and several seconds on every
        # run for no benefit.
        #
        # openssl@3 + curl are keg-only, so their paths are exported
        # explicitly. Those exports are what make build.zig's system-deps
        # probe return use_system=true and skip the ~5-10 min vendored
        # libcurl cross-compile — the same reason the backend cell sets
        # them. coreutils provides GNU `timeout`/`stat`; nothing in this
        # job needs them today, but pnpm's postinstall scripts on macOS
        # have historically reached for `timeout`, and a missing binary
        # there fails as an opaque pnpm error rather than a missing
        # dependency.
        #
        # ripgrep is NOT optional: src/modules/agent/tools/search.zig
        # spawns `rg`, so without it every search-related functional test
        # fails with error.FileNotFound.
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install pkg-config openssl@3 curl ripgrep
          echo "LDFLAGS=-L$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        # The windows-2022 image already has VS 2022 with the C++ workload.
        # This action's only job is to export that environment (cl.exe /
        # link.exe / INCLUDE / LIB) to $GITHUB_PATH and $GITHUB_ENV so
        # every LATER step sees it — each `run:` block is a brand-new
        # process, so Set-Item on Env: would not survive.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        # `shell: pwsh` per the project rule (bash = mac/linux,
        # pwsh = windows). The image ships vcpkg already bootstrapped at
        # C:\vcpkg, so this is normally a no-op; the clone-and-bootstrap
        # path exists for an image that ever stops shipping it.
        shell: pwsh
        run: |
          if (Test-Path "C:\vcpkg\vcpkg.exe") {
            Write-Host "ok vcpkg already bootstrapped at C:\vcpkg"
          } else {
            Write-Host "vcpkg missing from the image - bootstrapping from source..."
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
          if (-not (Get-Command cl -ErrorAction SilentlyContinue)) {
            Write-Error "cl.exe is not on PATH -- ilammy/msvc-dev-cmd did not run"
            exit 1
          }
          $global:LASTEXITCODE = 0

      - name: Install vcpkg ports (Windows)
        if: runner.os == 'Windows'
        # ALL FOUR ports in ONE `vcpkg install` invocation. vcpkg takes an
        # exclusive lock on .vcpkg-running.lock, so running the ports in
        # parallel (4x Start-Job) fails three of the four with "calling
        # try_take_exclusive_file_lock failed with 16" — reproduced on CI
        # run 31936399742 with all 4 jobs completing and useMSVC=True. The
        # single-command path is also ~30% faster because vcpkg shares its
        # download cache across the ports.
        #
        # build.zig hardcodes the sysroot at C:\vcpkg\installed\x64-windows,
        # so the host triplet is pinned BEFORE the install: anything else
        # builds the ports into a directory the Zig build never looks in,
        # and an arm64 auto-detect would additionally try to rebuild
        # vcpkg's own host helpers with a cross-toolchain.
        #
        # sqlite3 needs the explicit `fts5` feature. Without it, Migration
        # 058 and 070 (which create the messages_fts / agent_memories_fts
        # FTS5 virtual tables) fail with "no such module: fts5" at
        # migration.up() time, which took 184 tests down with them
        # (CI run 32323478653).
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_HOST_TRIPLET = "x64-windows"
          $portList = "curl:x64-windows", "openssl:x64-windows", "libpq:x64-windows", "sqlite3[fts5]:x64-windows"
          Write-Host ("Running: vcpkg install " + ($portList -join " "))
          & C:\vcpkg\vcpkg.exe install --recurse $portList
          if ($LASTEXITCODE -ne 0) {
            Write-Error ("vcpkg install failed with exit code " + $LASTEXITCODE)
            exit 1
          }
          # Verify each port's install location before the build runs, so
          # a missing port fails HERE with a package-level message rather
          # than deep inside a Zig link error. Flat Test-Path statements,
          # no hashtable iteration: that shape used to trip a brace-counter
          # desync in PowerShell 5.1 on the old self-hosted Windows box.
          $expected = @{
            "curl"    = "C:/vcpkg/installed/x64-windows/include/curl/curl.h"
            "openssl" = "C:/vcpkg/installed/x64-windows/include/openssl/ssl.h"
            "libpq"   = "C:/vcpkg/installed/x64-windows/include/libpq-fe.h"
            "sqlite3" = "C:/vcpkg/installed/x64-windows/include/sqlite3.h"
          }
          foreach ($port in $expected.Keys) {
            if (-not (Test-Path $expected[$port])) {
              Write-Error ("vcpkg port " + $port + " missing at " + $expected[$port])
              exit 1
            }
            Write-Host ("ok " + $port)
          }
          $global:LASTEXITCODE = 0

      - name: Cache python venv + playwright chromium
        # Two things are worth persisting, both OUTSIDE the workspace
        # because the workspace is a fresh checkout on every GitHub-hosted
        # job:
        #   - the pytest/playwright venv, at ${{ runner.temp }}/nalar-ci-venv
        #     (build.zig reads NALAR_FUNC_VENV_DIR at config time)
        #   - Playwright's Chromium download, at ~/.cache/ms-playwright
        #
        # Key scoped by RUNNER IMAGE (`inputs.os`) plus the interpreter,
        # never by `runner.os`: a venv is a directory of scripts and
        # site-packages whose layout and wheel tags are platform-specific
        # (Windows uses `Scripts/`, not `bin/`), so a Linux-built venv
        # restored onto a Windows runner is not a slow cache hit — it is a
        # broken interpreter path. Three cells means three caches; that is
        # the price of running the suites on three platforms.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ runner.temp }}/nalar-ci-venv
          key: v3-py-${{ inputs.os }}-py312-${{ hashFiles('tests/functional/requirements.txt', 'tests/functional_ui/requirements.txt') }}
          restore-keys: |
            v3-py-${{ inputs.os }}-py312-

      - name: Cache pnpm store
        # The Vite dev server is spawned by UIHarness during the run via
        # `pnpm run dev`, so the webapp's (gitignored) node_modules has to
        # exist before the tests run. Caching pnpm's content-addressed
        # store is the supported equivalent of the old hand-rolled tarball
        # cache: it survives across jobs, and pnpm hard-links packages out
        # of it instead of re-downloading. Scoped by runner image for the
        # same reason as the venv — pnpm's store holds platform-tagged
        # optional dependencies.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: v3-pnpm-${{ inputs.os }}-${{ hashFiles('src/apps/desktop/pnpm-lock.yaml') }}
          restore-keys: |
            v3-pnpm-${{ inputs.os }}-

      - name: Cache Zig build artifacts
        # NEW, and the reason sharding does not cost what it looks like.
        # Every shard runs `zig build functional-test-all`, which walks
        # the whole build graph to produce the service binary. This job
        # used to cache NOTHING zig-related, so every shard — and there
        # are now three per platform instead of one — paid a full cold
        # compile of the same SHA. Shards 2 and 3 restore this and start
        # from the object files shard 1 wrote.
        #
        # The key is scoped by RUNNER IMAGE and host triple, never by
        # `runner.os`, for the same reason the backend cell's cache is:
        # `.zig-cache` is compiled host state, and a Linux cache restored
        # onto a macOS runner is not a slow hit, it is a build that
        # cannot link. `target_zig` is passed in rather than recomputed
        # here because the caller already spells the triple out per cell.
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            src/modules/databases/vendor
          key: v1-func-zig-${{ inputs.os }}-${{ inputs.target_zig }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/modules/databases/scripts/fetch-vendor-sqlite3.sh') }}
          restore-keys: |
            v1-func-zig-${{ inputs.os }}-${{ inputs.target_zig }}-

      - name: Resolve the Zig global cache dir
        id: zig-global-dir
        # Asked of zig rather than hardcoded: `~/.cache/zig` on Linux,
        # `~/Library/Caches/zig` on macOS, `%LOCALAPPDATA%\zig` on Windows,
        # and `actions/cache` does not expand shell variables in `path:`.
        # cygpath -u on Windows because zig reports backslashes there and
        # a backslash inside a YAML `path:` is an escape character.
        shell: bash
        run: |
          set -euo pipefail
          raw="$(zig env | sed -n 's/.*"global_cache_dir"[[:space:]]*:[[:space:]]*"\(.*\)",/\1/p')"
          if [ -z "$raw" ]; then
            echo "::error::zig env did not report global_cache_dir — cannot cache it"
            exit 1
          fi
          case "$raw" in
            [A-Za-z]:*) resolved="$(cygpath -u "$raw")" ;;
            *)          resolved="$raw" ;;
          esac
          echo "path=$resolved" >> "$GITHUB_OUTPUT"
          echo "zig global cache: $resolved"

      - name: Cache the Zig global cache (fetched package sources)
        # The `build.zig.zon` tarballs (kabelweb, ruangsql) that `zig
        # build` fetches over the network at CONFIG time — i.e. before
        # the pytest run below, and before its retry wrapper gets a
        # chance to see the log. Keeping them warm removes most of the
        # DNS-flake class this job historically retried around.
        uses: actions/cache@v4
        with:
          path: ${{ steps.zig-global-dir.outputs.path }}
          key: v1-func-zig-global-${{ inputs.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            v1-func-zig-global-${{ inputs.os }}-

      - name: Install webapp dependencies (UI suite needs Vite)
        # node + pnpm are on PATH from the setup steps above. The store dir
        # is passed explicitly (rather than via a config file) so it cannot
        # disagree with the actions/cache path above. Every cell pays this
        # because both suites now run in the same job — the previous split
        # charged it to the UI job alone, but charged the UI job its own
        # venv + browser + binary build instead. One bill beats two.
        shell: bash
        env:
          npm_config_store_dir: ${{ runner.temp }}/pnpm-store
        run: |
          set -euo pipefail
          command -v pnpm >/dev/null 2>&1 || { echo "x pnpm not on PATH -- pnpm/action-setup must have failed" >&2; exit 1; }
          command -v node >/dev/null 2>&1 || { echo "x node not on PATH -- setup-node must have failed" >&2; exit 1; }
          pushd src/apps/desktop >/dev/null
          pnpm install --frozen-lockfile
          popd >/dev/null
          echo "ok webapp deps ready"

      - name: "Functional suites: API + Playwright UI (one pytest run)"
        # ~730 tests across both suites. Each boots its own nalar against an
        # isolated tmpdir HOME and rmtree's it on teardown; the Python
        # harness enforces the "never delete real $HOME" invariant via
        # is_safe_tmp() — see tests/functional/harness.py.
        #
        # NO `-n auto` (pytest-xdist), on purpose. xdist is the obvious way
        # to make this faster and it is wrong here: the port picker binds a
        # probe socket, closes it, and hands the number to the nalar child,
        # which binds tens of milliseconds later. That gap is documented in
        # harness.py's RANDOM_PORT_* comment as the reason the range moved
        # to 20k-32k in the first place — and widening the range does not
        # help when N workers draw from it at the same instant. Under -n the
        # suite would trade a deterministic ~15 min for intermittent
        # BindFailed at boot. If this job ever needs to be faster, the fix
        # is a reservation protocol in the picker (bind, hold, hand off),
        # not a flag.
        shell: bash
        env:
          # The pytest venv lives OUTSIDE the workspace because the
          # workspace is a fresh checkout on every GitHub-hosted job — only
          # runner.temp survives long enough for the cache step above to
          # persist it. build.zig reads this at config time, and it is also
          # what normalises Windows' mixed separators to the `Scripts/`
          # layout.
          NALAR_FUNC_VENV_DIR: ${{ runner.temp }}/nalar-ci-venv
          # ── THE SHARD ─────────────────────────────────────────────
          # These two variables are the entire sharding contract; they
          # are read by tests/conftest.py, which slices the collected
          # items with `index % total == index`. Nothing about them
          # reaches build.zig: `b.addSystemCommand` inherits the parent
          # environment, so `zig build functional-test-all` forwards them
          # to the pytest process it spawns, and the invocation stays
          # the one the local dev loop uses.
          #
          # They are set on THIS STEP rather than at job level because
          # job-level `env:` is also visible to the cache steps, where a
          # stray NALAR_FUNC_SHARD_* would make a cache key look shard-
          # specific for no reason.
          NALAR_FUNC_SHARD_TOTAL: ${{ inputs.shard_total }}
          NALAR_FUNC_SHARD_INDEX: ${{ inputs.shard_index }}
        run: |
          set -u
          echo "→ functional-test: starting on $RUNNER_OS, shard $NALAR_FUNC_SHARD_INDEX/$NALAR_FUNC_SHARD_TOTAL"
          # Two Windows-only PATH edits, both about the SERVICE binary
          # starting at all rather than about any test:
          #
          #   1. vcpkg's bin dir — nalar.exe's DLL imports (libcurl.dll,
          #      sqlite3.dll, libssl-3-x64.dll, ...) must resolve at
          #      process-load time.
          #   2. C:\Windows\System32\downlevel — Windows 11 ships the
          #      api-ms-win-crt-* UCRT forwarder DLLs there, not in
          #      System32\, and MinGW's dlopen does not understand API-set
          #      virtual resolution. Without it the binary
          #      STATUS_DLL_NOT_FOUNDs before main() runs.
          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            export PATH="/c/vcpkg/installed/x64-windows/bin:$PATH"
            export PATH="/c/Windows/System32/downlevel:$PATH"
            local_pnpm_path="$(command -v pnpm 2>/dev/null || true)"
            if [[ -n "$local_pnpm_path" ]]; then
              export PATH="$(dirname "$local_pnpm_path"):$PATH"
            fi
          fi

          # Retry wrapper (2026-09-13, run 34741794778): `zig build`
          # resolves build.zig.zon deps over the network at config time
          # (kabelweb/ruangsql tarballs from github.com). A transient DNS
          # flake aborts the whole job before any test runs with
          # `build.zig.zon:19:20: error: invalid HTTP response:
          # NameServerFailure`. The backend `install` step already retries
          # 3x for the same class of flake — do the same here, but ONLY for
          # fetch-phase network errors (log matches the network pattern). A
          # real pytest failure is not retried: a flake that needs three
          # attempts to pass is a flake to fix, not to average out.
          attempt=1
          max_attempts=3
          rc=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "→ functional-test: attempt $attempt/$max_attempts"
            set +e
            zig build functional-test-all --summary all 2>&1 | tee /tmp/functional-test.log | tail -n 80
            rc=${PIPESTATUS[0]}
            set -e
            echo "→ functional-test: attempt $attempt exit code $rc"
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if grep -Eq "NameServerFailure|invalid HTTP response|TemporaryFailure|NetworkUnreachable|ConnectionReset|Connection refused|failed to fetch|Could not resolve host" /tmp/functional-test.log 2>/dev/null; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                backoff=$((15 * attempt))
                echo "→ functional-test: transient fetch error, retrying in ${backoff}s..."
                sleep "$backoff"
                attempt=$((attempt + 1))
                continue
              fi
            fi
            break
          done
          echo "→ functional-test: exit code $rc"
          if [ "$rc" -ne 0 ]; then
            echo "✗ functional-test: failed (full log: /tmp/functional-test.log)"
            # Print the VERDICT lines, not just the tail of the log.
            #
            # `tail -n 100` is what this used to be, and it is worthless at
            # scale: pytest's short summary is ONE LINE PER FAILED/ERRORED
            # TEST, so a run with 548 errors and 92 failures buries every
            # failure name below the last 100 lines and the log shows only
            # the ERROR tail. That is exactly what happened on the first
            # windows-2022 run of this job — the tail showed 7 identical
            # is_safe_tmp errors and the 92 unrelated failures were simply
            # not in the log.
            #
            # The pattern is NOT anchored with `^`. Every line in this file
            # carries a `2026-09-30T08:55:52.7383797Z ` timestamp prefix, so
            # `^FAILED` matches nothing and the block silently reports zero
            # failures — which is the same uselessness as the tail it
            # replaced. `grep -c` also exits 1 on zero matches, so a
            # `|| echo 0` fallback would print "0" AND the real count; use
            # `|| true` and let grep's own "0" stand.
            echo "----- failed / errored tests (first 60 of $(grep -cE '(FAILED|ERROR) tests/' /tmp/functional-test.log 2>/dev/null || true)) -----"
            grep -E '(FAILED|ERROR) tests/' /tmp/functional-test.log 2>/dev/null | sed 's/^[^ ]*Z //' | head -n 60 || echo "  (no FAILED/ERROR lines found — the failure is above the pytest run)"
            echo "----- summary -----"
            grep -E '=+ .*(passed|failed|error).* =+' /tmp/functional-test.log 2>/dev/null | tail -n 2 || true
            echo "----- last 40 lines -----"
            tail -n 40 /tmp/functional-test.log
            exit 1
          fi
          echo "✓ functional-test: both suites passed"

      - name: Copy the shard log somewhere upload-artifact can reach
        # `/tmp/functional-test.log` is a Git Bash path — correct on all
        # three runners, including windows-2022, where the run steps are
        # `shell: bash`. It is NOT a path the upload action understands
        # there: that is Node, resolving against a Windows filesystem,
        # and `C:\...\tmp` is not where Git Bash put it. The workspace
        # root is the one directory both agree on, so the log is copied
        # there and uploaded by relative path.
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/functional-test.log ]; then
            cp /tmp/functional-test.log functional-test.log
            echo "staged $(wc -l < functional-test.log) lines for upload"
          else
            echo "no /tmp/functional-test.log — the run died before it wrote one"
          fi

      - name: Upload the shard log (on failure)
        # Only on failure, and only this shard's log. Sharding turned
        # "one 50-minute log per platform" into "one short log per
        # shard", which is exactly when a downloadable copy is worth
        # having: the run is red, and the tail of a red run is the part
        # nobody can read.
        #
        # `continue-on-error` because artifact storage is an account-level
        # quota this repo does not control, and hitting it turned an
        # otherwise-green run red once already. The gate is the pytest
        # step above; this is a diagnostic.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          # Named per platform AND per shard: the three shards of one
          # platform upload in parallel, and a shared name makes the
          # second and third fail on a duplicate.
          name: functional-test-${{ inputs.os }}-shard-${{ inputs.shard_index }}-log
          path: functional-test.log
          if-no-files-found: ignore
          retention-days: 7
