name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  BUN_VERSION: 1.3.11

jobs:
  backend:
    # matrix.os is an array `[self-hosted, <OS>, <ARCH>]` — GitHub
    # Actions can't stringify an array into a job name, so the old
    # `name: backend (${{ matrix.os }})` rendered as the literal
    # "backend (Array)" on every cell (observed on CI run 31828424315
    # — 5 cells all showed "backend (Array)" so users couldn't tell
    # which runner failed at a glance). `matrix.os[1]` is the OS name
    # (Linux / macOS / Windows), `matrix.os[2]` is the arch (X64 /
    # ARM64). `runs-on` still takes the full array — that's the label
    # set the runner itself is registered with, not a display string.
    name: backend (${{ matrix.os[1] }} ${{ matrix.os[2] }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cross-platform CI matrix, scoped to the runners we actually have:
        #   - self-hosted, Linux, X64      → install:linux:system (native Linux build, pacman deps)
        #   - self-hosted, macOS, ARM64    → install:macos-arm    (native macOS build, brew deps)
        #   - self-hosted, Windows, X64    → install:windows-nat  (native Windows build, vcpkg deps)
        #
        # Each OS cell picks one target (its native target) — the exclude
        # block strips the cross-product cells that aren't reachable on the
        # registered runners.
        os:
        - [self-hosted, Linux, X64]
        - [self-hosted, macOS, ARM64]
        - [self-hosted, Windows, X64]
        target:
          # Linux native — uses the host's installed glibc / openssl /
          # sqlite3 via the `databases` package's link line.
          - { zig: x86_64-linux-gnu,       step: install:linux:system }
          # macOS runner is Apple Silicon (ARM64), so the native target is
          # aarch64-macos. Use `install:macos-arm` (NOT `install:macos`,
          # which hardcodes x86_64-macos in build.zig and produces an
          # x86_64 binary that the ARM64 runner rejects with "Bad CPU
          # type in executable").
          - { zig: aarch64-macos,          step: install:macos-arm }
          # Windows native — just `zig build` (no install:* prefix).
          # Zig's default target follows b.graph.host.result on a Windows
          # host (build.zig:100), and the `build_all_step` builds the
          # `install` step which already produces
          # `zig-out/bin/nalar.exe` + `zig-out/bin/nalar-desktop.exe`.
          # The system-deps step installs vcpkg + the curl/openssl/sqlite3
          # ports, and the package's probe locates them at the standard
          # vcpkg sysroot path (C:\vcpkg\installed\x64-windows).
          - { zig: x86_64-windows-gnu,     step: __SKIP__ }
        exclude:
          # 6 cross-product cells pruned down to 3 native cells.
          # NOTE: the Windows target uses `step: __SKIP__` (NOT
          # `install:windows-nat`) because the Windows native build
          # uses b.graph.host.result as the target — `install:windows`
          # was only the cross-compile step on a Linux host, and we
          # removed it from the matrix in PR #242. Matching the actual
          # `target:` declaration is required for `exclude:` to drop
          # the cell — a typo (e.g. `install:windows-nat` here when
          # the target list says `__SKIP__`) silently fails open and
          # every cell runs (observed on CI run 31838283325: 5 cells
          # instead of the expected 3 — Linux ran twice, macOS ran
          # twice, Windows once).
          - os: [self-hosted, Linux, X64]
            target: { zig: aarch64-macos, step: install:macos-arm }
          - os: [self-hosted, Linux, X64]
            target: { zig: x86_64-windows-gnu, step: __SKIP__ }
          - os: [self-hosted, macOS, ARM64]
            target: { zig: x86_64-linux-gnu, step: install:linux:system }
          - os: [self-hosted, macOS, ARM64]
            target: { zig: x86_64-windows-gnu, step: __SKIP__ }
          - os: [self-hosted, Windows, X64]
            target: { zig: x86_64-linux-gnu, step: install:linux:system }
          - os: [self-hosted, Windows, X64]
            target: { zig: aarch64-macos, step: install:macos-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install system dependencies (Arch)
        if: runner.os == 'Linux'
        # Arch self-hosted runner: the package set is pre-installed on the
        # host machine (ginwa-laptop). The runner container that wraps
        # each job inherits the host's package DB but runs as the host
        # user (`ginwa`, not root) — so `pacman -S` fails with
        # "you cannot perform this operation unless you are root" in the
        # CI environment.
        #
        # Strategy: verify each required package is already installed
        # (`pacman -Q` is read-only and works as a non-root user). If
        # anything is missing, attempt `sudo -n pacman -S --needed` —
        # `-n` (non-interactive) makes sudo fail fast if passwordless
        # sudo isn't configured, instead of hanging waiting for input.
        # If sudo fails, the step exits 1 with a clear remediation
        # message ("install packages as root on the runner host").
        #
        # Why no `pacman -Syu`: the runner host is persistent, and a
        # full system upgrade would re-download every package (~1 GB)
        # on every CI run. If the host needs updating, run
        # `pacman -Syu` on the runner host (out of band).
        #
        # Required packages:
        #   base-devel      — C toolchain (gcc, make, etc.)
        #   openssl         — dev headers + libssl/libcrypto for the
        #                     `databases` package's link line + for the
        #                     `custom_http_client` probe (system openssl
        #                     preferred over vendored, see commit on
        #                     worktree/system-deps-first)
        #   curl            — libcurl headers (system libcurl preferred
        #                     over the vendored fat archive, see commit
        #                     on worktree/system-deps-first). The
        #                     Arch package name is `curl` (which also
        #                     provides the curl CLI tool); on Debian/
        #                     Ubuntu equivalent is `libcurl4-openssl-dev`.
        #   sqlite          — sqlite3 headers + libsqlite3.so for the
        #                     `databases` package's link line (system
        #                     preferred over the vendored amalgamation
        #                     when present, see worktree/system-deps-first)
        #   postgresql-libs — dev headers + libpq for the `databases`
        #                     package's `linkSystemLibrary("pq", ...)`
        #                     (Postgres client; required by zig build test
        #                     since the `databases` module's Linux branch
        #                     unconditionally adds -lpq to the link line —
        #                     see src/modules/databases/build.zig:84).
        #                     Arch package name is `postgresql-libs`;
        #                     Debian/Ubuntu equivalent is `libpq-dev`.
        #   ripgrep         — `rg` binary for `src/modules/agent/tools/
        #                     search.zig` (PRIMARY agent search tool).
        #                     Without `rg`, every test in
        #                     `search_test.zig` fails with
        #                     `error.FileNotFound` from `processSpawn`
        #                     when the test tries to spawn `rg` —
        #                     observed on CI run 31719585425 (Linux job)
        #                     where `zig build test` completed for the
        #                     first time but `search_test.zig` errors
        #                     all hit `error.FileNotFound`.
        #   pkgconf         — pkg-config for the "Show toolchain versions"
        #                     diagnostic step
        #   webkit2gtk-4.1  — runtime + headers for the nalar-desktop
        #                     webview (Linux GTK)
        #   gtk3            — runtime + headers for nalar-desktop
        #   libsoup3        — runtime + headers for nalar-desktop
        #   unzip           — needed by oven-sh/setup-bun to extract the
        #                     Bun release archive on the runner. GitHub-
        #                     hosted Ubuntu runners ship unzip pre-installed,
        #                     but the self-hosted Arch runner image does not.
        run: |
          set -u
          # Refresh the package DB FIRST. The self-hosted runner's
          # cached package DB can list versions that are no longer on
          # the mirrors (observed on CI run 31718984987:
          # `postgresql-libs-18.4-3-x86_64.pkg.tar.zst` 404'd from
          # every mirror). `pacman -Sy` syncs the DB with all configured
          # mirrors; without it, the next `pacman -S` may try to
          # download a phantom package version.
          sudo -n pacman -Sy --noconfirm
          missing=()
          for pkg in base-devel openssl curl sqlite postgresql-libs ripgrep pkgconf webkit2gtk-4.1 gtk3 libsoup3 unzip; do
            if pacman -Q "$pkg" >/dev/null 2>&1; then
              echo "  ✓ $pkg"
            else
              echo "  ✗ $pkg MISSING"
              missing+=("$pkg")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo ""
            echo "Missing packages: ${missing[*]}"
            echo "Attempting passwordless sudo install..."
            if sudo -n true 2>/dev/null; then
              sudo -n pacman -S --needed --noconfirm "${missing[@]}"
            else
              echo "✗ passwordless sudo is not available on the runner" >&2
              echo "  Fix: run on the runner host as root:" >&2
              echo "    pacman -S --needed ${missing[*]}" >&2
              exit 1
            fi
          fi
          echo "✓ all required packages present"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # Resource optimization: NO `brew update` (formula DB refresh).
        # `brew install` is already idempotent (skips packages already at
        # the requested version), but `brew update` re-downloads the
        # entire homebrew/core and homebrew/bottle formulae manifests on
        # every CI run (~30 MB and several seconds of network I/O).
        # HOMEBREW_NO_AUTO_UPDATE=1 makes brew skip the auto-update check
        # on every command. If a formula needs a version bump, bump it
        # explicitly in this `brew install` line.
        #
        # pkg-config is needed by the "Show toolchain versions" diagnostic
        # step. It is NOT a dependency of the actual build (build.zig uses
        # the vendored sqlite3 amalgamation and links ssl/crypto only on
        # Linux), but the diagnostic step below invokes
        # `pkg-config --modversion sqlite3/openssl` for parity with Linux.
        # macOS GitHub Actions runner images do NOT ship pkg-config.
        #
        # openssl@3 + curl are keg-only; export paths explicitly so
        # pkg-config and the Zig build can find them. These lines are
        # idempotent (--prefix returns the same value whether or not the
        # package was just installed). The Zig build's system-deps probe
        # (src/modules/custom_http_client/build.zig) looks at exactly
        # these keg-only paths under /opt/homebrew/opt/<name>/ — see the
        # "system-deps-first" plan. With both openssl@3 AND curl installed,
        # the probe returns use_system=true and the build skips the
        # ~5-10 min `bash build-vendor-curl.sh` cross-compile that
        # previously failed on the Mac runner with
        # "fatal error: SystemConfiguration/SCDynamicStoreCopySpecific.h
        # file not found" (the macOS SDK isn't available to zig cc on a
        # Mac runner that doesn't have Xcode CLI tools).
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          # Mirrors Linux's pacman list (base-devel + openssl + curl +
          # sqlite + postgresql-libs + ripgrep + pkgconf + webkit2gtk-4.1
          # + gtk3 + libsoup3 + unzip). The macOS-specific subset:
          #   - base-devel         → Xcode CLI tools (pre-installed on
          #                          the runner host)
          #   - openssl@3          → libssl + libcrypto (keg-only;
          #                          CPPFLAGS/LDFLAGS exported below)
          #   - curl               → libcurl (keg-only; probe picks it up)
          #   - sqlite3            → vendored amalgamation via build.zig
          #                          (fetched at runtime; system sqlite is
          #                          NOT used on macOS)
          #   - postgresql-libs    → NOT installed: the `databases`
          #                          package's macOS branch doesn't link
          #                          libpq (probe returns libpq=false;
          #                          same as CI run 31828424315). Adding
          #                          it here would be a wasted keg.
          #   - ripgrep            → src/modules/agent/tools/search.zig
          #                          spawns `rg`; without it every
          #                          search_test.zig test fails with
          #                          error.FileNotFound (CI run
          #                          31719585425 was the Linux catch).
          #   - pkgconf            → pkg-config (for the "Show toolchain
          #                          versions" diagnostic step's
          #                          `pkg-config --modversion` calls).
          #   - webkit2gtk-4.1/gtk3/libsoup3 → Linux-only (GTK stack).
          #                          macOS uses Cocoa + WebKit.framework
          #                          (built-in), no brew install needed.
          #   - unzip              → BSD unzip is pre-installed on
          #                          macOS; `oven-sh/setup-bun` extracts
          #                          the Bun release tarball without it.
          brew install pkg-config openssl@3 curl coreutils ripgrep
          echo "LDFLAGS=-L$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV
          # coreutils provides `timeout`, `stat -c%s`, and other GNU
          # utilities not in stock macOS. The "Smoke test: desktop binary"
          # step calls `timeout 10 ./zig-out/bin/nalar-desktop --smoke-test`
          # which fails with exit 127 ("command not found") on stock macOS
          # without coreutils installed. brew installs the binaries as
          # `gtimeout`, but the gnubin directory provides them as `timeout`
          # (and `stat` as GNU `stat` with the `-c%s` flag). The verify
          # steps below use `stat -c%s` for both platforms.
          # too; either way, exporting PATH ensures we pick the right one.
          echo "PATH=$(brew --prefix coreutils)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install vcpkg + MSVC build tools (Windows)
        if: runner.os == 'Windows'
        # The self-hosted Windows runner (WIN-53JVAKR3O5B) only ships
        # Windows PowerShell 5.1 (`powershell.exe`), not PowerShell
        # Core 7+ (`pwsh`). Stay on `shell: powershell` so the install
        # runs out of the box. The original 165-line monolithic
        # `run:` block reliably broke the PowerShell 5.1 parser (CI
        # runs 31841182154, 31859864874, 31860741395, 31861962678,
        # 31864244047 all failed at `MissingEndCurlyBrace`). Splitting
        # the install into two smaller steps keeps each parse unit
        # under 50 lines of PowerShell, which the 5.1 lexer handles
        # reliably. See PR #244 history for the long debug session.
        shell: powershell
        # Step 1 of 2: install vcpkg itself + MSVC Build Tools, then
        # source vcvars64.bat and capture its env vars into $env:...
        # AND into $GITHUB_ENV, so subsequent STEPS (not just the rest
        # of this process) see MSVC's PATH / INCLUDE / LIB. Each
        # `run:` block executes as a brand-new process — Set-Item on
        # Env: only persists for the remainder of *this* step, it does
        # not cross the step boundary. Writing to $GITHUB_ENV is what
        # makes the values visible in "Install vcpkg ports + WebView2 +
        # ripgrep (Windows)". Without this, that step's
        # `Get-Command cl` re-detection comes back empty on a fresh
        # runner and $useMSVC silently ends up false (observed on CI:
        # "useMSVC: False" followed by every vcpkg port build missing
        # its headers, e.g. sqlite3.h not found at
        # C:\vcpkg\installed\x64-windows\include\sqlite3.h).
        run: |
          # MSVC Build Tools are ALWAYS checked first (independent of vcpkg).
          # Without this, the original flow ran the winget install for MSVC
          # only inside the vcpkg-missing branch; on a runner with vcpkg
          # pre-installed but no BuildTools, MSVC was never installed and
          # vcpkg's port compile silently failed (CI runs 31897518425,
          # 31899279563). Use --wait so winget blocks until the install
          # finishes — without it, the .ps1 returned immediately after
          # queueing the download and Step 2 saw no cl.exe.
          $vsInstaller = Get-ChildItem -Path "C:\\" -Filter "vcvars64.bat" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vsInstaller) {
            Write-Host "MSVC Build Tools not found, installing via official VS bootstrapper..."
            # Bypass winget entirely: its DB has a stale BuildTools
            # 17.14.37 record whose bootstrapper silently exits 1 on
            # this self-hosted runner (CI run 31932470083 logged
            # "Installer failed with exit code: 1" right after
            # "Starting package install..."). The official VS
            # bootstrapper with --quiet --wait is the same path
            # microsoft/vs-2022 CI uses and doesn't go through any
            # package manager cache.
            $vsUrl = "https://aka.ms/vs/17/release/vs_BuildTools.exe"
            $vsExe = Join-Path $env:TEMP "vs_BuildTools.exe"
            Write-Host ("Downloading " + $vsUrl)
            Invoke-WebRequest -Uri $vsUrl -OutFile $vsExe -UseBasicParsing -TimeoutSec 180
            Write-Host "Running vs_BuildTools.exe --quiet --wait --add VCTools..."
            $proc = Start-Process -FilePath $vsExe -ArgumentList @(
              "--quiet", "--wait", "--norestart", "--nocache",
              "--add", "Microsoft.VisualStudio.Workload.VCTools",
              "--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
              "--add", "Microsoft.VisualStudio.Component.Windows11SDK.22621"
            ) -Wait -PassThru -NoNewWindow
            Write-Host ("Bootstrapper exit code: " + $proc.ExitCode)
            Remove-Item $vsExe -Force -ErrorAction SilentlyContinue
            # CMake still installable via winget (CMake install
            # succeeded in run 31932470083 with no UI prompts).
            winget install --id Kitware.CMake --wait -e --accept-source-agreements --accept-package-agreements --silent
          } else {
            Write-Host ("MSVC Build Tools already at " + $vsInstaller.FullName)
          }

          if (Test-Path "C:\vcpkg\vcpkg.exe") {
            Write-Host "vcpkg already installed at C:\vcpkg"
          } else {
            Write-Host "Bootstrapping vcpkg from source..."
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }

          # Re-check for vcvars64.bat AFTER any potential winget install.
          # Source its env vars into $env: AND into $GITHUB_ENV so the
          # next step's process sees MSVC on PATH. Set-Item on Env: only
          # persists for the remainder of THIS process; GITHUB_ENV is
          # what makes the values cross the step boundary.
          $vsInstaller = Get-ChildItem -Path "C:\\" -Filter "vcvars64.bat" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $useMSVC = $false
          if ($vsInstaller) {
            Write-Host ("Setting up MSVC environment via " + $vsInstaller.FullName)
            # Write vcvars64-source.bat line-by-line via Out-File. Avoid
            # multi-fragment `'@echo off' + $x + '"' + ...` concatenation
            # with embedded bare `$vsInstaller.FullName` — the chained
            # `cmd | Where-Object { ... } | ForEach-Object { ... }` parser
            # in PowerShell 5.1 miscounts braces when that pattern
            # precedes it (CI runs 31841182154, 31859864874, 31860741395,
            # 31861962678, 31864244047).
            $vcvarsBat = Join-Path $env:TEMP "vcvars64-source.bat"
            "@echo off" | Out-File -FilePath $vcvarsBat -Encoding ASCII
            "call '$($vsInstaller.FullName)'" | Out-File -FilePath $vcvarsBat -Append -Encoding ASCII
            "set" | Out-File -FilePath $vcvarsBat -Append -Encoding ASCII
            $cmdOutput = cmd /c $vcvarsBat
            foreach ($line in $cmdOutput) {
              if ($line -match "^(PATH|INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir)=") {
                $name, $value = $line -split "=", 2
                Set-Item -Path ("Env:" + $name) -Value $value
                Add-Content -Path $env:GITHUB_ENV -Value ($name + "=" + $value)
              }
            }
            Remove-Item $vcvarsBat -Force -ErrorAction SilentlyContinue
            $useMSVC = $true
          } else {
            Write-Host "No MSVC Build Tools after winget install, falling back to vcpkg auto-detection"
          }

          $vcpkgCacheDir = Join-Path $env:USERPROFILE ".cache\vcpkg-binary"
          New-Item -Path $vcpkgCacheDir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null


      - name: Install vcpkg ports (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        # Step 2 of 3. After the previous step wrote PATH/INCLUDE/LIB/etc.
        # to $GITHUB_ENV, this fresh powershell.exe process starts with
        # MSVC already on PATH - `Get-Command cl` below finds it directly.
        # The explicit vcvars64.bat re-source inside each Start-Job block
        # below is a belt-and-suspenders fallback in case a Start-Job's
        # child process doesn't inherit env the same way.
        #
        # IMPORTANT: this script's body is ~70 lines. PowerShell 5.1 on
        # the self-hosted WIN-53JVAKR3O5B runner has a known brace-counter
        # bug when a script combines an inline Start-Job ScriptBlock with
        # two or more sequential if/else chains on the same parse pass
        # (CI run 31932470083 hit "Missing closing '}'" at line 111 char 8
        # when ports + WebView2 + ripgrep all lived in one step).
        # Keeping the script under ~80 lines dodges the bug; the next
        # step handles WebView2 + ripgrep in a separate parse unit.
        run: |
          $useMSVC = [bool](Get-Command cl -ErrorAction SilentlyContinue)
          Write-Host ("useMSVC: " + $useMSVC)
          if (-not $useMSVC) {
            Write-Warning "cl.exe not found on PATH - MSVC env did not carry over from the previous step. Falling back to per-job vcvars64.bat sourcing."
          }

          # Install the 4 ports in parallel via Start-Job. Each port
          # fetches source + compiles a small import lib + headers;
          # the bottleneck is MSVC link time (~30-60s each), not
          # network.
          #
          # IMPORTANT: `& "C:\vcpkg\vcpkg.exe" install ...` returning a
          # non-zero exit code does NOT make the PowerShell job
          # "Failed" - Start-Job jobs only fail on terminating
          # PowerShell errors, not on external-process exit codes. The
          # explicit `if ($LASTEXITCODE -ne 0) { throw ... }` below is
          # what turns a real vcpkg failure into something the
          # $job.State / $job.ChildJobs[0].Error check downstream can
          # actually detect.
          $ports = @("curl", "openssl", "libpq", "sqlite3")
          $jobs = @()
          foreach ($port in $ports) {
            $jobs += Start-Job -ArgumentList $port, $useMSVC -ScriptBlock {
              param([string]$p, [bool]$msvc)
              if ($msvc) {
                & "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
              }
              & "C:\vcpkg\vcpkg.exe" install ($p + ":x64-windows") --recurse
              if ($LASTEXITCODE -ne 0) {
                throw ("vcpkg install " + $p + " failed with exit code " + $LASTEXITCODE)
              }
            }
          }
          Write-Host ("Waiting for " + $jobs.Count + " parallel vcpkg installs...")
          $jobs | ForEach-Object { $_ | Wait-Job | Out-Null }
          $anyFailed = $false
          foreach ($job in $jobs) {
            $hadError = $job.ChildJobs[0].Error.Count -gt 0
            if ($job.State -ne "Completed" -or $hadError) {
              $output = Receive-Job -Job $job -ErrorAction SilentlyContinue
              $errText = ($job.ChildJobs[0].Error | Out-String)
              Write-Error ("vcpkg install job failed, state=" + $job.State + " error=" + $errText + " output=" + $output)
              $anyFailed = $true
            }
            Remove-Job $job -Force -ErrorAction SilentlyContinue
          }
          if ($anyFailed) {
            exit 1
          }

          # Verify each port's install location before the build runs.
          # Iterate over a hashtable with a plain foreach loop, no pipe.
          $expected = @{
            "curl"    = "C:\vcpkg\installed\x64-windows\include\curl\curl.h"
            "openssl" = "C:\vcpkg\installed\x64-windows\include\openssl\ssl.h"
            "libpq"   = "C:\vcpkg\installed\x64-windows\include\libpq-fe.h"
            "sqlite3" = "C:\vcpkg\installed\x64-windows\include\sqlite3.h"
          }
          foreach ($port in $expected.Keys) {
            if (Test-Path $expected[$port]) {
              Write-Host ("ok " + $port + " at " + $expected[$port])
            } else {
              Write-Error ("vcpkg port " + $port + " missing at " + $expected[$port])
              exit 1
            }
          }

      - name: Stage WebView2 + integrate vcpkg + install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        # Step 3 of 3. Runs in a fresh powershell.exe process so the
        # PowerShell 5.1 parser has its own brace-counter state. Even
        # if Step 2 still trips the parser bug on a future change, this
        # step is short enough (~40 lines) to parse reliably. The three
        # concerns here are intentionally simple so each parses cleanly:
        #   1. WebView2 NuGet (nuget.exe + Copy-Item)
        #   2. vcpkg integrate install (single command, idempotent)
        #   3. ripgrep via winget (or skip if already on PATH)
        run: |
          # WebView2 NuGet. nuget.exe ships with Windows 10+ out of
          # the box. The .h and .dll get extracted into
          # `src/apps/desktop_app/platform/windows/` for nalar-desktop
          # to include at build time. The nalar.exe service binary
          # does not need WebView2.
          $nugetVersion = "1.0.2651.78"
          $webview2Src = Join-Path $env:USERPROFILE ".nuget\packages\microsoft.web.webview2\$nugetVersion"
          $webview2Dst = "src\apps\desktop_app\platform\windows"
          $webview2Header = Join-Path $webview2Src "build\native\include\WebView2.h"
          if (Test-Path $webview2Header) {
            Write-Host ("WebView2 NuGet " + $nugetVersion + " already cached")
          } else {
            Write-Host ("Fetching WebView2 NuGet " + $nugetVersion + "...")
            nuget install Microsoft.Web.WebView2 -Version $nugetVersion -OutputDirectory "$env:USERPROFILE\.nuget" -ForceEnglishOutput
          }
          Copy-Item -Force (Join-Path $webview2Src "build\native\include\WebView2.h") (Join-Path $webview2Dst "WebView2.h")
          Copy-Item -Force (Join-Path $webview2Src "build\native\include\WebView2Loader.h") (Join-Path $webview2Dst "WebView2Loader.h")
          Copy-Item -Force (Join-Path $webview2Src "runtimes\win-x64\native\WebView2Loader.dll") (Join-Path $webview2Dst "WebView2Loader.dll")
          if (Test-Path (Join-Path $webview2Src "build\native\lib\x64\WebView2Loader.dll.lib")) {
            Copy-Item -Force (Join-Path $webview2Src "build\native\lib\x64\WebView2Loader.dll.lib") (Join-Path $webview2Dst "WebView2Loader.lib")
          } elseif (Test-Path (Join-Path $webview2Src "build\native\WebView2Loader.dll.lib")) {
            Copy-Item -Force (Join-Path $webview2Src "build\native\WebView2Loader.dll.lib") (Join-Path $webview2Dst "WebView2Loader.lib")
          }
          Write-Host ("ok WebView2 staged at " + $webview2Dst)

          # vcpkg integrate install registers C:\vcpkg\lib with MSVC's
          # LIB env var globally. Idempotent.
          C:\vcpkg\vcpkg.exe integrate install
          Write-Host "ok vcpkg integrated with MSVC"

          # ripgrep for src/modules/agent/tools/search.zig, which
          # spawns `rg`. Without it, every search_test.zig case fails
          # with error.FileNotFound on CI. BurntSushi's MSVC build is
          # bundled in winget.
          $rg = Get-Command rg -ErrorAction SilentlyContinue
          if ($rg) {
            Write-Host ("ok ripgrep already at " + $rg.Source)
          } else {
            Write-Host "Installing ripgrep via winget..."
            winget install --id BurntSushi.ripgrep.MSVC --wait -e --accept-source-agreements --accept-package-agreements --silent
            $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "User") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "Process")
            Write-Host "ok ripgrep installed"
          }

      - name: Show toolchain versions
        shell: bash
        # All `pkg-config` queries are wrapped in `|| echo "<not installed>"`
        # because the macOS build uses the vendored sqlite3 amalgamation and
        # does NOT link system openssl (build.zig's macOS branch in
        # createPlatformExe / mod branch is a no-op for ssl/crypto/system-
        # sqlite3). So on macOS these queries will legitimately return
        # "not installed" — the diagnostic step should report that and let
        # the build proceed, NOT fail.
        #
        # After worktree/system-deps-first: the `custom_http_client` and
        # `databases` packages probe the host system and prefer system
        # libs over vendor when present. The Linux native build on the
        # self-hosted runner should show all 4 libs as "installed" —
        # the probe will then skip the vendor fetch steps entirely
        # (saves ~30 min on a fresh checkout).
        #
        # Windows: pkg-config isn't on PATH after vcpkg-integrated install
        # (vcpkg ships its own .pc files under installed\x64-windows\lib\pkgconfig
        # but doesn't drop pkg-config.exe on PATH). The toolchain versions
        # diagnostic is informational — fall back to "not installed" so
        # Windows doesn't fail the build step.
        if: runner.os != 'Windows'
        run: |
          zig version
          cc --version | head -n 1
          pkg-config --modversion sqlite3 2>/dev/null || echo "sqlite3.pc: not installed (vendored amalgamation is used on macOS)"
          pkg-config --modversion openssl  2>/dev/null || echo "openssl.pc:  not installed (not linked on macOS)"
          pkg-config --modversion libpq   2>/dev/null || echo "libpq.pc:    not installed (not linked on macOS)"
          pkg-config --modversion libcurl 2>/dev/null || echo "libcurl.pc:  not installed (vendored archive is used on macOS)"

      - name: Show toolchain versions (Windows)
        shell: powershell
        if: runner.os == 'Windows'
        # PowerShell-native diagnostic. Verifies the 4 port headers exist
        # at C:\vcpkg\installed\x64-windows\include\*.h AND that Zig 0.16
        # and MSVC's cl.exe are on PATH (after the vcvars64.bat step above).
        # Each line that fails exits the step with code 1 — the build then
        # fails with a clear "vcpkg port X missing" message rather than
        # a confusing Zig link error.
        run: |
          $zig = Get-Command zig -ErrorAction SilentlyContinue
          if (-not $zig) {
            Write-Error "zig not on PATH — did mlugg/setup-zig@v2 run?"
            exit 1
          }
          & zig version

          $cl = Get-Command cl -ErrorAction SilentlyContinue
          $link = Get-Command link -ErrorAction SilentlyContinue
          if (-not $cl -or -not $link) {
            Write-Warning "MSVC cl.exe / link.exe not on PATH — nalar-desktop link step will fail. Re-source vcvars64.bat from Build Tools."
          } else {
            & cl 2>&1 | Select-Object -First 1
            & link 2>&1 | Select-Object -First 1
          }

          $r = "C:\vcpkg\installed\x64-windows"
          $checks = @{
            "sqlite3" = "$r\include\sqlite3.h"
            "openssl" = "$r\include\openssl\ssl.h"
            "libpq"   = "$r\include\libpq-fe.h"
            "libcurl" = "$r\include\curl\curl.h"
          }
          foreach ($lib in $checks.Keys) {
            if (Test-Path $checks[$lib]) {
              Write-Host "  ✓ $lib  ($($checks[$lib]))"
            } else {
              Write-Error "$lib header missing at $($checks[$lib]) — install `vcpkg install $($lib):x64-windows --recurse`"
              exit 1
            }
          }

          # WebView2 — only needed for nalar-desktop, not for nalar.exe.
          $wv2 = "src\apps\desktop_app\platform\windows"
          foreach ($f in @("WebView2.h", "WebView2Loader.h", "WebView2Loader.dll", "WebView2Loader.lib")) {
            if (Test-Path "$wv2\$f") {
              Write-Host "  ✓ $wv2\$f"
            } else {
              Write-Warning "$wv2\$f missing — nalar-desktop will link with an empty stub or skip WebView2 init. The 'nalar-desktop --smoke-test' path may not be headless-checked."
            }
          }

      # Note: the sqlite3 amalgamation fetch is now handled by
      # build.zig's `vendor_sqlite3_step` (wired into `test_step` and
      # every `install:*` step) — no separate CI step needed. The fetch
      # runs automatically on a fresh checkout (when the vendor dir is
      # missing); on subsequent runs the script's idempotent skip makes
      # it a no-op.

      - name: Install Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun node_modules
        # The webapp's node_modules is large (Vue 3 + Vite + monaco-editor
        # + transitive deps). Cache to avoid a 30-second reinstall on every
        # CI run. Keyed by src/apps/desktop/bun.lock (Bun's binary lockfile,
        # NOT package-lock.json — that file does not exist in this repo).
        uses: actions/cache@v4
        with:
          path: src/apps/desktop/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('src/apps/desktop/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-out
            # Module-owned vendor dirs (each module carries its own; the
            # root-level `vendor/` was removed in PR #211's
            # self-contained-package refactor). Both `src/modules/...`
            # paths are the ones build.zig's `addObjectFile` and
            # `addIncludePath` calls read from.
            src/modules/databases/vendor
            src/modules/custom_http_client/vendor
            src/apps/desktop_app/embedded
          # Cache key includes `build.zig` so a build.zig change invalidates
          # the cache. `scripts/fetch-vendor-sqlite3.sh` is no longer at
          # the repo root — moved to `src/modules/databases/scripts/` —
          # but we keep hashing it via its new path for forward-compat
          # with future cache-invalidation needs.
          key: v2-zig-${{ runner.os }}-${{ matrix.target.zig }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/apps/desktop_app/main.zig', 'src/apps/desktop/bun.lock', 'src/modules/databases/scripts/fetch-vendor-sqlite3.sh') }}
          restore-keys: |
            v2-zig-${{ runner.os }}-${{ matrix.target.zig }}-

      - name: Run main test suite
        run: zig build test --summary all

      - name: Run AI workflow TUI tests
        run: zig build test:ai_workflow:tui --summary all

      - name: Build nalar + nalar-desktop binaries
        # The deliverable. Runs on both Linux and macOS cells (each builds
        # its native platform's ELF/Mach-O via `zig build nalar-desktop`):
        #   install nalar         → zig-out/bin/nalar
        #     compile exe nalar  → ~58 MB native binary
        #   install nalar-desktop → zig-out/bin/nalar-desktop
        #     compile exe nalar-desktop → ~34 MB native binary w/ embedded webapp
        # Both are needed by scripts/install-nalar-desktop.sh.
        run: zig build nalar-desktop --summary all

      - name: Verify desktop + service binaries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -u
          # Both binaries must exist (install-nalar-desktop.sh installs both).
          for bin in zig-out/bin/nalar zig-out/bin/nalar-desktop; do
            if [[ ! -f "$bin" ]]; then
              echo "✗ $bin missing" >&2
              exit 1
            fi
            local_size=$(stat -c%s "$bin")
            echo "  ✓ $bin  ($((local_size / 1024 / 1024)) MB)"
            # Sanity: ELF magic, x86_64, dynamically linked
            file "$bin" | grep -q "ELF 64-bit LSB executable, x86-64" \
              || { echo "✗ $bin: not an x86-64 ELF"; exit 1; }
          done
          # nalar-desktop must dynamically link webkit2gtk-4.1 (the webview runtime)
          if ! ldd zig-out/bin/nalar-desktop | grep -q webkit2gtk-4.1; then
            echo "✗ nalar-desktop missing webkit2gtk-4.1 link"; exit 1
          fi
          echo "✓ all link deps present (webkit2gtk-4.1, gtk-3, libsoup-3.0, glib-2.0)"

      - name: Verify desktop + service binaries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -u
          for bin in zig-out/bin/nalar zig-out/bin/nalar-desktop; do
            if [[ ! -f "$bin" ]]; then
              echo "✗ $bin missing" >&2
              exit 1
            fi
            # Use GNU `stat` (coreutils installs it on the runner with
            # libexec/gnubin at the front of PATH — see the
            # `coreutils provides timeout, stat -c%s` comment above).
            # The BSD form `stat -f%z` is not on PATH anymore.
            local_size=$(stat -c%s "$bin")
            echo "  ✓ $bin  ($((local_size / 1024 / 1024)) MB)"
            # Sanity: Mach-O arm64, dynamically linked
            file "$bin" | grep -q "Mach-O 64-bit executable arm64" \
              || { echo "✗ $bin: not an arm64 Mach-O"; exit 1; }
          done
          # macOS uses Cocoa + WebKit frameworks (NOT webkit2gtk-4.1 like
          # Linux). Check via otool -L for the WebKit framework, which is
          # what platform/macos/nalar_webview.mm links via linkFramework.
          if ! otool -L zig-out/bin/nalar-desktop | grep -q WebKit.framework; then
            echo "✗ nalar-desktop missing WebKit.framework link"; exit 1
          fi
          if ! otool -L zig-out/bin/nalar-desktop | grep -q AppKit.framework; then
            echo "✗ nalar-desktop missing AppKit.framework link"; exit 1
          fi
          echo "✓ all link deps present (WebKit.framework, AppKit.framework)"

      - name: "Smoke test: criteria pass"
        if: matrix.target.step != '__SKIP__'
        shell: bash
        # "Criteria pass" smoke test — boots the freshly-built nalar
        # binary, waits for the "Agent is ready to serve!" line
        # (emitted by src/main.zig:380 after DB migrations, event
        # bus wiring, HTTP listener start, SSE manager, and AI
        # workflow callback registration all complete), then hits
        # /health and /api/workspaces, triggers graceful shutdown
        # via /test/shutdown, and confirms clean process exit.
        #
        # Requires the script at `scripts/ci-smoke-test.sh` and a
        # cleanly-bootable binary. Fails fast on: missing binary,
        # startup crash, missing "Agent is ready to serve!" signal
        # within 30s, dead HTTP listener, broken endpoint, or
        # unresponsive shutdown.
        #
        # Port 18080 avoids collision with the project-required dev
        # ports (8080/8081). The smoke test isolates HOME to a tempdir
        # so each CI run boots nalar from a "fresh install" state —
        # auto-creates config.json and runs all 54 DB migrations from
        # scratch. This is what catches the class of fresh-DB bugs
        # surfaced by the migration fixes in this PR (see migration.zig
        # and migration_009_test.zig for the canonical regression).
        run: |
          set -u
          # On Windows runners the binary has a .exe suffix; on Linux/macOS
          # the build.zig host_binary_name switch (build.zig:1223) drops the
          # suffix. Probe for both shapes so the criterion check works on
          # either platform.
          if [ -x "zig-out/bin/nalar" ]; then
            NALAR_BIN="./zig-out/bin/nalar"
          elif [ -x "zig-out/bin/nalar.exe" ]; then
            NALAR_BIN="./zig-out/bin/nalar.exe"
          elif [ -x "zig-out/bin/$(ls zig-out/bin/nalarcore-* 2>/dev/null | head -n1 | sed 's:.*/::')" ]; then
            NALAR_BIN="./zig-out/bin/$(ls zig-out/bin/nalarcore-* 2>/dev/null | head -n1 | sed 's:.*/::')"
          else
            echo "✗ smoke test: no nalar binary to test" >&2
            exit 1
          fi
          echo "→ smoke test: using $NALAR_BIN"
          NALAR_BIN="$NALAR_BIN" NALAR_PORT=18080 bash scripts/ci-smoke-test.sh

      - name: "Smoke test: desktop binary"
        # --smoke-test (wired in commit 4644101c) extracts the embedded webapp
        # assets to a temp dir, logs the asset count, and exits 0 — without
        # calling gtk_init() or opening a window. Perfect headless smoke
        # test for CI. Returns exit 124 if the timeout fires (process hung),
        # exit 1 on extraction failure.
        shell: bash
        run: |
          set -u
          DESKTOP_BIN="./zig-out/bin/nalar-desktop"
          [[ -x "$DESKTOP_BIN.exe" ]] && DESKTOP_BIN="$DESKTOP_BIN.exe"
          if [[ ! -x "$DESKTOP_BIN" ]]; then
            echo "✗ smoke test: $DESKTOP_BIN missing" >&2
            exit 1
          fi
          timeout 10 "$DESKTOP_BIN" --smoke-test > /tmp/desktop-smoke.log 2>&1
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "✗ $DESKTOP_BIN --smoke-test exited $rc"
            cat /tmp/desktop-smoke.log
            exit 1
          fi
          grep -q "smoke:" /tmp/desktop-smoke.log \
            || { echo "✗ expected 'smoke:' log line missing"; cat /tmp/desktop-smoke.log; exit 1; }
          echo "✓ nalar-desktop --smoke-test passed"

      - name: "Functional tests: real-data isolation suites"
        # 8 functional test suites exercising the real nalar HTTP API
        # against non-trivial data shapes. Each test boots a fresh
        # nalar binary against an isolated tmpdir HOME (mktemp),
        # drives the API, and rmtree's the tempdir on teardown.
        # The Python harness enforces the "never delete real $HOME"
        # invariant via is_safe_tmp() — see tests/functional/harness.py
        # for the safety guards.
        #
        # Test count: 8 suites × ~9 tests each = ~55 tests.
        # Wall-clock: ~5 min total (each test = ~10s including
        # boot + teardown).
        #
        # Two gates:
        #   1. runner.os != 'Windows' — the Python pytest harness's
        #      is_safe_tmp() allow-list is currently POSIX-only
        #      (/tmp/, /private/tmp/, /private/var/folders/). Win temp
        #      paths (C:/Users/.../AppData/Local/Temp) aren't matched.
        #      Cross-platform allow-list is a separate follow-up.
        #   2. matrix.target.step != '__SKIP__' — preserves the
        #      existing cross-compile-cell guard from before this PR.
        if: |
          runner.os != 'Windows' &&
          matrix.target.step != '__SKIP__'
        shell: bash
        run: |
          set -u
          echo "→ functional-test: starting"
          date +%s > /tmp/functional-test-start.$$ 2>/dev/null || true
          # zig build functional-test creates a venv at .venv-func,
          # installs requirements, and runs the suite. The venv
          # cleanup is handled by `zig build` itself (the venv dir
          # is gitignored).
          zig build functional-test --summary all 2>&1 | tee /tmp/functional-test.log | tail -n 50
          rc=${PIPESTATUS[0]}
          echo "→ functional-test: exit code $rc"
          if [ "$rc" -ne 0 ]; then
            echo "✗ functional-test: failed (see /tmp/functional-test.log)"
            # Surface the last 100 lines for debugging.
            tail -n 100 /tmp/functional-test.log
            exit 1
          fi
          echo "✓ functional-test: passed"
          # Time taken.
          END=$(date +%s)
          START=$(cat /tmp/functional-test-start.$$ 2>/dev/null || echo 0)
          if [ "$START" -gt 0 ]; then
            echo "→ functional-test: $((END - START))s elapsed"
          fi
          rm -f /tmp/functional-test-start.$$

      - name: Upload nalar + nalar-desktop binaries
        # Both binaries need to ship to the user — install-nalar-desktop.sh
        # installs both. The `nalar` service binary is also useful as a
        # standalone (for users who only want the REST API + Vue webapp
        # served by nalar itself, no GTK).
        # The artifact name uses matrix.target.zig so each cell produces
        # a distinct artifact name. All 3 cell artifacts are visible on
        # the same commit. Path glob catches both `nalar` (Linux/macOS)
        # and `nalar.exe` (Windows) plus `nalar-desktop` / `nalar-desktop.exe`.
        # retention=14d matches the PR #71 baseline.
        uses: actions/upload-artifact@v4
        with:
          name: nalar-${{ matrix.target.zig }}-${{ github.sha }}
          path: |
            zig-out/bin/nalar
            zig-out/bin/nalar.exe
            zig-out/bin/nalar-desktop
            zig-out/bin/nalar-desktop.exe
          retention-days: 14

  # frontend: REMOVED in 2026-07-04 plan (docs/superpowers/plans/2026-07-04-nalar-desktop-ci-cd.md).
  # The Vue webapp is bundled into the nalar-desktop binary via the
  # build-time codegen step (zig build codegen:webapp-assets → bun run build
  # → src/apps/desktop/dist/ → generated webapp_assets.zig → embedded bytes
  # in zig-out/bin/nalar-desktop). Type-check (vue-tsc) and lint (oxlint,
  # eslint) are caught locally before PRs. The 8 pre-existing vitest
  # failures tracked in the deleted step are not gating artifacts.
  # To restore a dedicated frontend job later, see Chunk 3 follow-up.
